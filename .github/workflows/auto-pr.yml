name: Auto PR

# Claude Code cloud sessions push their work to claude/* branches but don't open
# pull requests unless asked. This opens a draft PR for each such branch so the
# work shows up for review.
#
# Needs Settings → Actions → General → "Allow GitHub Actions to create and approve
# pull requests". PRs opened with GITHUB_TOKEN don't trigger pull_request workflows,
# so CI also runs on claude/** pushes.

on:
  push:
    branches: ['claude/**']

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-pr-${{ github.ref }}

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open a draft PR unless the branch already has one
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ -n "$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "An open PR already tracks $BRANCH."
            exit 0
          fi

          # a PR closed without merging means someone decided against it; don't reopen on every push
          if [ -n "$(gh pr list -R "$REPO" --head "$BRANCH" --state closed --json number,mergedAt --jq '.[] | select(.mergedAt == null) | .number')" ]; then
            echo "A PR for $BRANCH was closed without merging; not opening another."
            exit 0
          fi

          # nothing new: a branch whose commits already landed (merged PR) or that matches the base
          ahead=$(gh api "repos/$REPO/compare/$BASE...$BRANCH" --jq '.ahead_by')
          if [ "$ahead" -eq 0 ]; then
            echo "$BRANCH has no commits that $BASE lacks."
            exit 0
          fi

          message=$(gh api "repos/$REPO/commits/$BRANCH" --jq '.commit.message')
          title=$(printf '%s\n' "$message" | head -n 1)
          {
            printf '%s\n' "$message" | tail -n +2 | sed '/^Co-Authored-By:/d; /^Claude-Session:/d'
            printf "\n---\nOpened automatically for \`%s\` (%s commit(s) ahead of \`%s\`). Mark it ready for review when the work is done.\n" "$BRANCH" "$ahead" "$BASE"
          } > body.md

          gh pr create -R "$REPO" --base "$BASE" --head "$BRANCH" --draft --title "$title" --body-file body.md

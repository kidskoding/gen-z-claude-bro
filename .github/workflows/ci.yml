name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Manifests and Codex copy in sync
        run: node scripts/sync.js --check
      - name: Hook tests
        run: node --test test/hooks.test.js
      - name: Shell syntax
        run: bash -n hooks/*.sh

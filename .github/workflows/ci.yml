name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # the hooks themselves run on node in Claude Code, and the tests spawn them with it
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Manifests and Codex copy in sync
        run: bun run check
      - name: Hook tests
        run: bun test
      - name: Shell syntax
        run: bash -n hooks/*.sh
